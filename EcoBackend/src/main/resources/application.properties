spring.application.name=EcoBackend




# Server port
server.port=8082




# MySQL (XAMPP) - import database/ecorepairhub.sql first
spring.datasource.url=jdbc:mysql://localhost:3306/ecorepairhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
# Code required to register a new ADMIN account from the sign-up page
app.admin-signup-code=ECO-ADMIN-2026
